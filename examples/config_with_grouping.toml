# Example configuration with document grouping settings
# Copy to config.toml and customize as needed

# Global settings
training_data = "training_data/{term}.jsonl"

[workflow.grouping]
# Enable/disable document grouping
enabled = true

# Constraint type: "count" (by document count) or "words" (by total word count)
constraint_type = "count"

# Size range for groups
min_size = 3
max_size = 8

# Clustering linkage method: "average", "complete", or "single"
linkage_method = "average"

[output]
cache = "cache"
path = "runs/{mode}/{model}/{repeat}/{term}"

[tools.crawl4ai]
max_concurrent = 5
timeout = 30
max_retries = 3
delay_between_requests = 1.0

# Example mode configurations
[modes.small_groups]
[modes.small_groups.workflow.grouping]
enabled = true
constraint_type = "count"
min_size = 2
max_size = 4

[modes.large_groups]  
[modes.large_groups.workflow.grouping]
enabled = true
constraint_type = "count"
min_size = 8
max_size = 15

[modes.word_based]
[modes.word_based.workflow.grouping]
enabled = true
constraint_type = "words"
min_size = 1000
max_size = 5000

[modes.no_grouping]
[modes.no_grouping.workflow.grouping]
enabled = false
